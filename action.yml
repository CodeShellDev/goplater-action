name: Goplater
description: Run Goplater in your GitHub Actions workflow
author: CodeShellDev

branding:
  icon: package
  color: blue

inputs:
  path:
    description: File or directory to template
    default: "."

  version:
    description: Goplater version to use
    default: "latest"

  source:
    description: Source directory, ~/ is relative to it
    default: "."

  output:
    description: Output directory for templated files
    default: "."

  recursive:
    description: Recursively process files
    default: "false"

  flatten:
    description: Flatten output paths
    default: "false"

  root:
    description: Source root; output paths are relative to it (default is inferred)
    default: ""

  match:
    description: Regexes to match files (one per line)
    default: ".*"

  exclude:
    description: Regexes to exclude files (one per line)
    default: ""

  hidden:
    description: Include dotfiles and dotfolders
    default: ""

  binary:
    description: Include binary files
    default: ""

  allowed-inputs:
    description: Comma-separated allowed input directories
    default: ""

  allowed-outputs:
    description: Comma-separated allowed output directories
    default: ""

  trim-max-blank-lines:
    description: Maximum blank lines kept around non-output actions (-1 = off)
    default: "-1"

  dry-run:
    description: Show what would be written without changing anything
    required: false
    default: "false"

  ignore-errors:
    description: Continue processing when errors occur
    required: false
    default: "false"

outputs:
  version:
    description: Actual Goplater release tag used
    value: ${{ steps.download.outputs.version }}

  os:
    description: Operating system target used for the download
    value: ${{ steps.download.outputs.os }}

  arch:
    description: CPU architecture target used for the download
    value: ${{ steps.download.outputs.arch }}

  asset:
    description: Name of the downloaded release asset
    value: ${{ steps.download.outputs.asset }}

  download-url:
    description: URL used to download the Goplater release asset
    value: ${{ steps.download.outputs.download-url }}

runs:
  using: composite
  steps:
    - name: Download Goplater
      id: download
      shell: bash
      env:
        GOPLATER_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        if [ "$GOPLATER_VERSION" = "latest" ]; then
          release_url="https://api.github.com/repos/CodeShellDev/goplater/releases/latest"
        elif [ "$GOPLATER_VERSION" = "latest-prerelease" ]; then
          release_url="https://api.github.com/repos/CodeShellDev/goplater/releases?per_page=1"
        else
          release_url=""
        fi

        if [ -n "$release_url" ]; then
          if [ "$GOPLATER_VERSION" = "latest" ]; then
            GOPLATER_VERSION="$(
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$release_url" |
              jq -r '.tag_name'
            )"
          else
            GOPLATER_VERSION="$(
              curl -fsSL \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$release_url" |
              jq -r '.[0].tag_name'
            )"
          fi

          if [ -z "$GOPLATER_VERSION" ] || [ "$GOPLATER_VERSION" = "null" ]; then
            echo "Failed to determine the requested Goplater version" >&2
            exit 1
          fi
        fi

        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          MINGW*|MSYS*|CYGWIN*) os="windows" ;;
          *)
            echo "Unsupported operating system: $(uname -s)" >&2
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        extension=""
        if [ "$os" = "windows" ]; then
          extension=".exe"
        fi

        asset="goplater-${GOPLATER_VERSION}-${os}-${arch}${extension}"
        url="https://github.com/CodeShellDev/goplater/releases/download/${GOPLATER_VERSION}/${asset}"
        binary="$RUNNER_TEMP/goplater${extension}"

        echo "Goplater version: ${GOPLATER_VERSION}"
        echo "Platform: ${os}/${arch}"
        echo "Asset: ${asset}"
        echo "Download URL: ${url}"

        curl -fL "$url" -o "$binary"
        chmod +x "$binary"

        {
          echo "version=$GOPLATER_VERSION"
          echo "os=$os"
          echo "arch=$arch"
          echo "asset=$asset"
          echo "download-url=$url"
          echo "binary=$binary"
        } >> "$GITHUB_OUTPUT"

    - name: Run Goplater
      shell: bash
      env:
        GOPLATER_BINARY: ${{ steps.download.outputs.binary }}
        RECURSIVE: ${{ inputs.recursive }}
        FLATTEN: ${{ inputs.flatten }}
        ROOT: ${{ inputs.root }}
        INPUT_PATH: ${{ inputs.path }}
        OUTPUT: ${{ inputs.output }}
        SOURCE: ${{ inputs.source }}
        ALLOWED_INPUTS: ${{ inputs.allowed-inputs }}
        ALLOWED_OUTPUTS: ${{ inputs.allowed-outputs }}
        MATCH: ${{ inputs.match }}
        EXCLUDE: ${{ inputs.exclude }}
        HIDDEN: ${{ inputs.hidden }}
        BINARY: ${{ inputs.binary }}
        TRIM_MAX_BLANK_LINES: ${{ inputs.trim-max-blank-lines }}
        DRY_RUN: ${{ inputs.dry-run }}
        IGNORE_ERRORS: ${{ inputs.ignore-errors }}
      run: |
        set -euo pipefail

        args=(
          "$INPUT_PATH"
          "--recursive=$RECURSIVE"
          "--flatten=$FLATTEN"
          "--root=$ROOT"
          "--allowed-inputs=$ALLOWED_INPUTS"
          "--allowed-outputs=$ALLOWED_OUTPUTS"
          "--output=$OUTPUT"
          "--source=$SOURCE"
          "--hidden=$HIDDEN"
          "--binary=$BINARY"
          "--trim-max-blank-lines=$TRIM_MAX_BLANK_LINES"
          "--dry-run=$DRY_RUN"
          "--ignore-errors=$IGNORE_ERRORS"
        )

        while IFS= read -r pattern; do
          [[ -n "$pattern" ]] && args+=("--match=$pattern")
        done <<< "$MATCH"

        while IFS= read -r pattern; do
          [[ -n "$pattern" ]] && args+=("--exclude=$pattern")
        done <<< "$EXCLUDE"

        "$GOPLATER_BINARY" template "${args[@]}"
