name: Goplater
description: Run Goplater in your GitHub Actions workflow
author: CodeShellDev

branding:
  icon: package
  color: blue

inputs:
  version:
    description: "Goplater version to use (default: 'latest')"
    required: false
    default: "latest"

  recursive:
    description: Recursively process files
    required: false
    default: "false"

  flatten:
    description: Flatten output INPUT_PATHs without preserving source directory structure
    required: false
    default: "false"

  root:
    description: Source root; output keeps INPUT_PATHs relative to it (default is inferred)
    required: false
    default: ""

  path:
    description: File or directory to template
    required: true

  output:
    description: Output directory for templated files
    required: false
    default: "."

  source:
    description: Source directory containing files
    required: false
    default: "."

  allowed-outputs:
    description: Allowed output directories, including their subdirectories (comma-separated list)
    required: false
    default: ""

  match:
    description: Regular expressions used to match files for processing
    required: false
    default: ".*"

  trim-max-blank-lines:
    description: "Experimental: maximum blank lines kept around non-output actions (-1 disables trimming)"
    required: false
    default: "-1"

  dry-run:
    description: Show what would be written without changing anything
    required: false
    default: "false"

  ignore-errors:
    description: Continue processing when errors occur
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download Goplater
      id: download
      shell: bash
      env:
        GOPLATER_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        if [ "$GOPLATER_VERSION" = "latest" ]; then
          GOPLATER_VERSION="$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/CodeShellDev/goplater/releases/latest |
            jq -r '.tag_name'
          )"

          if [ -z "$GOPLATER_VERSION" ] || [ "$GOPLATER_VERSION" = "null" ]; then
            echo "Failed to determine the latest Goplater version" >&2
            exit 1
          fi
        fi

        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          MINGW*|MSYS*|CYGWIN*) os="windows" ;;
          *)
            echo "Unsupported operating system: $(uname -s)" >&2
            exit 1
            ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        extension=""
        if [ "$os" = "windows" ]; then
          extension=".exe"
        fi

        asset="goplater-${GOPLATER_VERSION}-${os}-${arch}${extension}"
        url="https://github.com/CodeShellDev/goplater/releases/download/${GOPLATER_VERSION}/${asset}"
        binary="$RUNNER_TEMP/goplater${extension}"

        echo "Downloading ${asset}"
        curl -fL "$url" -o "$binary"
        chmod +x "$binary"

        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - name: Run Goplater
      shell: bash
      env:
        GOPLATER_BINARY: ${{ steps.download.outputs.binary }}
        RECURSIVE: ${{ inputs.recursive }}
        FLATTEN: ${{ inputs.flatten }}
        ROOT: ${{ inputs.root }}
        INPUT_PATH: ${{ inputs.path }}
        OUTPUT: ${{ inputs.output }}
        SOURCE: ${{ inputs.source }}
        ALLOWED_OUTPUTS: ${{ inputs.allowed-outputs }}
        MATCH: ${{ inputs.match }}
        TRIM_MAX_BLANK_LINES: ${{ inputs.trim-max-blank-lines }}
        DRY_RUN: ${{ inputs.dry-run }}
        IGNORE_ERRORS: ${{ inputs.ignore-errors }}
      run: |
        set -euo pipefail

        args=(
          "$INPUT_PATH"
          "--recursive=$RECURSIVE"
          "--flatten=$FLATTEN"
          "--root=$ROOT"
          "--allowed-outputs=$ALLOWED_OUTPUTS"
          "--output=$OUTPUT"
          "--source=$SOURCE"
          "--match=$MATCH"
          "--trim-max-blank-lines=$TRIM_MAX_BLANK_LINES"
          "--dry-run=$DRY_RUN"
          "--ignore-errors=$IGNORE_ERRORS"
        )

        "$GOPLATER_BINARY" template "${args[@]}"
